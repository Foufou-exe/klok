name: Release

# Déclenché par un tag `vX.Y.Z`. Produit un APK signé avec la keystore de
# production et l'attache à une release GitHub, qui sert de canal de
# distribution privé.
#
# Secrets requis (Settings → Secrets and variables → Actions) :
#   KEYSTORE_BASE64   le fichier .jks encodé en base64
#                     (base64 -w0 klok-release.jks  |  clip)
#   KEYSTORE_PASSWORD mot de passe du keystore
#   KEY_PASSWORD      mot de passe de la clé
#   KEY_ALIAS         alias de la clé (par ex. « klok »)
#
# Sans ces secrets, le job échoue volontairement plutôt que de produire un APK
# signé en debug : un tel APK ne pourrait pas mettre à jour une installation
# existante.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.41.7'

jobs:
  release:
    name: APK signé
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Vérifier que le tag correspond à la version du pubspec
        # Un tag v2026.0.11 sur un pubspec resté en 2026.0.10 produirait un APK
        # dont la version affichée ment, y compris dans les sauvegardes.
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PUBSPEC=$(grep -m1 '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          if [ "$TAG" != "$PUBSPEC" ]; then
            echo "::error::Tag $TAG ≠ version du pubspec $PUBSPEC"
            exit 1
          fi
          echo "Version $PUBSPEC confirmée."

      - run: flutter test

      - name: Restaurer la keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret KEYSTORE_BASE64 absent — impossible de signer."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/klok-release.jks"

      - name: Écrire key.properties
        run: |
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=$RUNNER_TEMP/klok-release.jks
          EOF

      - name: Compiler l'APK release
        run: flutter build apk --release

      - name: Renommer l'APK
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk \
             "build/app/outputs/flutter-apk/klok-${GITHUB_REF_NAME}.apk"

      - name: Publier la release
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/klok-*.apk
          generate_release_notes: true
          body: |
            APK signé pour installation sur la tablette.

            **Installation** — télécharger l'APK sur la tablette et l'ouvrir.
            Android demandera d'autoriser l'installation depuis cette source la
            première fois. Les données existantes sont conservées : la mise à
            jour se fait par-dessus, sans désinstallation.

            Faire une sauvegarde depuis l'espace admin avant de mettre à jour
            reste la bonne habitude.

      - name: Nettoyer les secrets du disque
        if: always()
        run: rm -f android/key.properties "$RUNNER_TEMP/klok-release.jks"

name: CI

# Contrôles sur chaque poussée et chaque PR. La compilation d'un APK debug est
# incluse volontairement : elle attrape les régressions Gradle/manifest que
# `analyze` et `test` ne voient pas (identifiant d'application, ressources,
# fusion du manifest).
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.41.7'

jobs:
  analyse:
    name: Analyse & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get --enforce-lockfile

      - name: Vérifier le formatage
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyse statique
        run: flutter analyze

      - name: Tests
        run: flutter test

      - name: Vérifier que le code drift généré est à jour
        # `app_database.g.dart` est committé. S'il diverge de tables.dart, le
        # schéma compilé ne correspond plus au schéma déclaré — panne
        # silencieuse la plus coûteuse du projet.
        run: |
          dart run build_runner build --delete-conflicting-outputs
          if ! git diff --exit-code -- lib/data/db/; then
            echo "::error::Le code drift généré n'est pas à jour. Lance : dart run build_runner build --delete-conflicting-outputs"
            exit 1
          fi

  build-android:
    name: APK debug
    runs-on: ubuntu-latest
    needs: analyse
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get --enforce-lockfile

      - name: Compiler l'APK debug
        run: flutter build apk --debug

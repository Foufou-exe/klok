name: Release

# Déclenché par un tag `vX.Y.Z`. Produit un APK signé avec la keystore de
# production et l'attache à une release GitHub, qui sert de canal de
# distribution privé.
#
# Secrets requis (Settings → Secrets and variables → Actions) — deux seulement :
#   KEYSTORE_BASE64   la keystore PKCS12 encodée en base64
#                     (base64 -w0 klok-release.p12)
#   KEYSTORE_PASSWORD son mot de passe
#
# L'alias n'a pas à être fourni : il est lu dans la keystore avec keytool.
# Deux secrets facultatifs couvrent les cas particuliers :
#   KEY_ALIAS         pour forcer un alias au lieu de le détecter
#   KEY_PASSWORD      si la clé a un mot de passe distinct du magasin. En
#                     PKCS12, keytool impose en pratique le même pour les deux,
#                     donc on réutilise KEYSTORE_PASSWORD par défaut.
#
# Sans les secrets requis, le job échoue volontairement plutôt que de produire
# un APK signé en debug : un tel APK ne pourrait pas mettre à jour une
# installation existante.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.41.7'

jobs:
  release:
    name: APK signé
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get --enforce-lockfile

      - name: Vérifier la cohérence des versions
        # Trois sources doivent s'accorder, sinon la livraison ment :
        #   • le tag        → nom de la release
        #   • pubspec.yaml  → versionName de l'APK (et lib/core/version.dart,
        #                     déjà verrouillé par test/version_test.dart)
        #   • updates.json  → ce que les tablettes interrogent
        # Oublier le troisième est le piège du process : la release existe,
        # mais aucune tablette n'apprend jamais qu'elle est sortie.
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PUBSPEC=$(grep -m1 '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          # jq plutôt qu'un grep : le champ est lu comme du JSON, pas comme du
          # texte qu'un commentaire pourrait imiter.
          MANIFEST=$(jq -r '.version' updates.json)

          if [ "$TAG" != "$PUBSPEC" ]; then
            echo "::error::Tag $TAG ≠ version du pubspec $PUBSPEC"
            exit 1
          fi
          if [ "$TAG" != "$MANIFEST" ]; then
            echo "::error::Tag $TAG ≠ version d'updates.json ($MANIFEST). Bumpe updates.json, sinon les tablettes ne verront jamais cette version."
            exit 1
          fi
          echo "Version $PUBSPEC cohérente entre le tag, le pubspec et updates.json."

      - name: Rappeler que le manifeste doit vivre sur la branche par défaut
        # L'app interroge raw.githubusercontent.com/.../main/updates.json. Un
        # tag posé sur une branche de travail publierait un APK que personne ne
        # se verrait proposer.
        run: |
          # checkout@v4 ne rapatrie qu'un commit : il faut aller chercher main.
          git fetch --depth=100 origin main || true
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main 2>/dev/null; then
            echo "::warning::Ce tag n'est pas sur main. L'APK sera publié, mais updates.json ne sera pas servi tant que la branche n'est pas fusionnée dans main."
          fi

      - run: flutter test

      - name: Restaurer la keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret KEYSTORE_BASE64 absent — impossible de signer."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/klok-release.p12"

      - name: Écrire key.properties
        # Les secrets transitent par l'environnement plutôt que par une
        # substitution `${{ }}` directe dans le script : un mot de passe
        # contenant un backtick, un `$` ou un antislash serait sinon réinterprété
        # par le shell et écrirait une valeur fausse — échec de signature
        # incompréhensible à déboguer.
        env:
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          # Facultatifs : vides si les secrets ne sont pas définis.
          KEY_PASSWORD_OPT: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS_OPT: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ -z "$STORE_PASSWORD" ]; then
            echo "::error::Secret KEYSTORE_PASSWORD absent — impossible de signer."
            exit 1
          fi

          KEYSTORE="$RUNNER_TEMP/klok-release.p12"

          # L'alias est lu dans la keystore plutôt que codé en dur : c'est le
          # fichier qui fait autorité, pas une constante du dépôt. Le workflow
          # reste juste si la keystore est regénérée avec un autre alias.
          # Le mot de passe passe par stdin, jamais en argument : la ligne de
          # commande d'un processus est lisible par les autres processus.
          # -J-Duser.language=en fige la locale, sinon « PrivateKeyEntry »
          # pourrait être traduit selon l'environnement du runner.
          if [ -n "$KEY_ALIAS_OPT" ]; then
            KEY_ALIAS="$KEY_ALIAS_OPT"
            echo "Alias fourni par le secret KEY_ALIAS."
          else
            KEY_ALIAS=$(printf '%s\n' "$STORE_PASSWORD" \
              | keytool -list -keystore "$KEYSTORE" -storetype PKCS12 \
                  -J-Duser.language=en 2>/dev/null \
              | grep -m1 'PrivateKeyEntry' \
              | cut -d',' -f1 \
              | tr -d '[:space:]')
            echo "Alias lu dans la keystore."
          fi

          if [ -z "$KEY_ALIAS" ]; then
            echo "::error::Aucune clé privée trouvée dans la keystore. Mot de passe erroné, ou fichier ne contenant qu'un certificat."
            exit 1
          fi

          # En PKCS12, keytool impose en pratique le même mot de passe pour la
          # clé et pour le magasin ; le secret dédié ne sert qu'aux exceptions.
          KEY_PASSWORD="${KEY_PASSWORD_OPT:-$STORE_PASSWORD}"

          {
            printf 'storePassword=%s\n' "$STORE_PASSWORD"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'storeFile=%s\n' "$KEYSTORE"
          } > android/key.properties
          echo "key.properties écrit (alias : $KEY_ALIAS)."

      - name: Compiler l'APK release
        run: flutter build apk --release

      - name: Renommer l'APK
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk \
             "build/app/outputs/flutter-apk/klok-${GITHUB_REF_NAME}.apk"

      - name: Publier la release
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/klok-*.apk
          generate_release_notes: true
          body: |
            APK signé pour installation sur la tablette.

            **Installation** — télécharger l'APK sur la tablette et l'ouvrir.
            Android demandera d'autoriser l'installation depuis cette source la
            première fois. Les données existantes sont conservées : la mise à
            jour se fait par-dessus, sans désinstallation.

            Faire une sauvegarde depuis l'espace admin avant de mettre à jour
            reste la bonne habitude.

      - name: Nettoyer les secrets du disque
        if: always()
        run: rm -f android/key.properties "$RUNNER_TEMP/klok-release.p12"
